name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# actions/* намеренно оставлены на плавающих мажорах: пин на commit SHA требует
# сверенных дайджестов, а неверный SHA роняет весь CI. Мажорные теги actions/*
# сопровождаются самим GitHub, риск считаем приемлемым.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      # Отдельным шагом, а не отдельной джобой: переиспользуются тот же checkout
      # и уже прогретый кеш модулей и сборки. Обычный прогон оставлен — он
      # проверяет неинструментированный бинарник и падает быстрее.
      - name: test -race
        run: go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Версия запинена: @latest тянул в CI недетерминированный сторонний код.
      # Обновлять осознанно, вместе с зависимостями.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
