name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(go run ./cmd/sshmon --version | awk '{print $2}')"
          test "$want" = "$got" || { echo "buildinfo $got != tag $want"; exit 1; }
      - name: build
        run: |
          mkdir dist
          pack() {
            os="$1"; arch="$2"; ext="$3"
            bin="sshmon${ext}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "$bin" ./cmd/sshmon
            if [ "$os" = windows ]; then
              zip -q "dist/sshmon_${GITHUB_REF_NAME}_${os}_${arch}.zip" "$bin"
            else
              tar czf "dist/sshmon_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" "$bin"
            fi
            rm "$bin"
          }
          pack darwin  arm64 ""
          pack darwin  amd64 ""
          pack linux   arm64 ""
          pack linux   amd64 ""
          pack windows amd64 ".exe"
          (cd dist && sha256sum sshmon_* > checksums.txt)
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
      - name: formula checksums
        run: |
          {
            echo "## Formula/sshmon.rb"
            echo '```'
            echo "version \"${GITHUB_REF_NAME#v}\""
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
