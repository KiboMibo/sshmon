# ВНИМАНИЕ: это НЕ шаблон для копирования.
#
# Конфиг существует только ради записи demo.gif на трёх одноразовых
# SSH-контейнерах (см. sshd/), поднимаемых и удаляемых `demo/record.sh`.
# Он намеренно небезопасен:
#
#   password: demo        — пароль лежит в открытом виде в git;
#   insecure_host_key: true — проверка ключа хоста отключена, то есть
#                             соединение уязвимо к man-in-the-middle.
#
# Для настоящих серверов: аутентификация по ключу (`key:`) или через ssh-agent,
# `insecure_host_key` не указывать (по умолчанию хост-ключ проверяется по
# known_hosts), а файлу конфига с любыми секретами выставить `chmod 600`.
# Рабочий шаблон sshmon создаёт сам при первом запуске
# (~/.config/sshmon/config.yaml).
interval: 2s

servers:
  - name: web1
    host: web1
    port: 22
    user: root
    password: demo
    insecure_host_key: true
    group: prod
  - name: db1
    host: db1
    port: 22
    user: root
    password: demo
    insecure_host_key: true
    group: prod
  - name: cache1
    host: cache1
    port: 22
    user: root
    password: demo
    insecure_host_key: true
    group: dev

thresholds:
  cpu: 90
  mem: 90
  disk: 90

history:
  enabled: false
